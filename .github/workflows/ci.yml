# CI — card de arquivo único, sem build: a verificação é sintaxe + probe
# headless (instancia card e editor fora do navegador). Roda nas branches de
# trabalho e em todo PR do fluxo feature → develop → release → main.
name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - develop
      - release
  pull_request:
    branches: [develop, release, main]

jobs:
  check:
    name: Sintaxe & probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sintaxe
        run: node --check dist/mw-occupancy-motion-element.js

      - name: Probe headless (card + editor)
        run: node tools/probe.js

      - name: hacs.json aponta para o arquivo que existe
        run: |
          set -euo pipefail
          F=$(node -p "require('./hacs.json').filename")
          test -f "dist/$F"

      - name: Artefato para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: mw-occupancy-motion-element
          path: dist/mw-occupancy-motion-element.js
          retention-days: 7
